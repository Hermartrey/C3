databases:
  - name: fuelflow-db
    databaseName: fuelflow
    user: fuelflow_user
    plan: free

services:
  # ----------------------------------------------------
  # Backend Web Service (Django + Gunicorn)
  # ----------------------------------------------------
  - type: web
    name: fuelflow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuelflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SEED_DB
        value: "true"

  # ----------------------------------------------------
  # Frontend Static Site (React + Vite)
  # ----------------------------------------------------
  - type: web
    name: fuelflow-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://fuelflow-backend.onrender.com/api"
